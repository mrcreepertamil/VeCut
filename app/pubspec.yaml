name: vecut
description: A cross-platform video editor for Android and Windows.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  video_player: ^2.9.5
  path_provider: ^2.1.5
  ffmpeg_kit_flutter_new: ^4.6.8
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/textures/
