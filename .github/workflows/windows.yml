name: Windows Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Build C++ Qt desktop app (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt for Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure C++17 Qt application
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DVECUT_BUILD_DESKTOP=ON `
            -DBUILD_TESTING=ON

      - name: Build VeCut and engine tests
        run: cmake --build build-windows --config Release --parallel 2

      - name: Run C++ engine tests
        run: ctest --test-dir build-windows -C Release --output-on-failure

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: vecut-windows-x64
          path: build-windows/apps/vecut/Release/VeCut.exe
          if-no-files-found: error
          retention-days: 14
