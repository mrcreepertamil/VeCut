name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build C++ Qt Android APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true

      - name: Configure C++ Android build
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_NDK="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DVECUT_BUILD_DESKTOP=ON \
            -DBUILD_TESTING=OFF

      - name: Build Android APK
        run: cmake --build build-android --target apk --parallel 2

      - name: Prepare a simple APK download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_PATH="$(find build-android -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced by the Android build."
            exit 1
          fi
          cp "$APK_PATH" dist/VeCut-android-arm64.apk
          sha256sum dist/VeCut-android-arm64.apk > dist/VeCut-android-arm64.apk.sha256
          ls -lh dist/

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VeCut-Android-ARM64
          path: |
            dist/VeCut-android-arm64.apk
            dist/VeCut-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14

  engine-tests:
    name: C++ engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure engine
        run: cmake -S . -B build-engine -DVECUT_BUILD_DESKTOP=OFF -DBUILD_TESTING=ON

      - name: Build engine tests
        run: cmake --build build-engine --parallel 2

      - name: Run engine tests
        run: ctest --test-dir build-engine --output-on-failure
