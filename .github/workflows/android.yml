name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build C++ Qt Android APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify build host
        run: |
          set -euxo pipefail
          uname -a
          cmake --version
          java -version

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> "$GITHUB_ENV"

      - name: Keep Android SDK platform compatible with Qt 6.5
        run: |
          set -euxo pipefail
          find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 -type d ! -name 'android-33' -exec rm -rf {} +
          test -f "$ANDROID_HOME/platforms/android-33/android.jar"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          archives: qtbase qtsvg icu
          cache: true

      - name: Configure C++ Android build
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_NDK="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DVECUT_BUILD_DESKTOP=ON \
            -DBUILD_TESTING=OFF

      - name: Inspect generated Android build targets
        run: cmake --build build-android --target help

      - name: Compile C++ Android app
        run: cmake --build build-android --target VeCut --parallel 2

      - name: Package Android APK
        run: cmake --build build-android --target apk --parallel 2

      - name: Prepare a simple APK download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_PATH="$(find build-android -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced by the Android build."
            exit 1
          fi
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/33.0.2"
          UNSIGNED_APK="$RUNNER_TEMP/VeCut-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/VeCut-aligned.apk"
          cp "$APK_PATH" "$UNSIGNED_APK"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/vecut-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/vecut-debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out dist/VeCut-android-arm64.apk \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose dist/VeCut-android-arm64.apk
          sha256sum dist/VeCut-android-arm64.apk > dist/VeCut-android-arm64.apk.sha256
          ls -lh dist/

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: VeCut-Android-ARM64
          path: |
            dist/VeCut-android-arm64.apk
            dist/VeCut-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14

  engine-tests:
    name: C++ engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure engine
        run: cmake -S . -B build-engine -DVECUT_BUILD_DESKTOP=OFF -DBUILD_TESTING=ON

      - name: Build engine tests
        run: cmake --build build-engine --parallel 2

      - name: Run engine tests
        run: ctest --test-dir build-engine --output-on-failure
