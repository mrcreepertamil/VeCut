name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms=android .

      - name: Add VeCut Android launcher icon
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/app/src/main/res")
          (root / "drawable").mkdir(parents=True, exist_ok=True)
          (root / "mipmap-anydpi").mkdir(parents=True, exist_ok=True)
          (root / "mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          (root / "values").mkdir(parents=True, exist_ok=True)

          foreground = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M18,24 L35,24 L54,65 L73,24 L90,24 L62,82 Q58,90 54,90 Q50,90 46,82 Z"/>
              <path android:fillColor="#FF42E8C4"
                  android:pathData="M35,53 L76,35 L81,44 L40,62 Z"/>
              <path android:fillColor="#FF42E8C4"
                  android:pathData="M72,70 L88,70 L88,77 L72,77 Z"/>
          </vector>
          """
          (root / "drawable/ve_cut_icon_foreground.xml").write_text(foreground)

          background = """<resources>
              <color name="ve_cut_icon_background">#171321</color>
          </resources>
          """
          (root / "values/ve_cut_icon.xml").write_text(background)

          adaptive = """<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ve_cut_icon_background"/>
              <foreground android:drawable="@drawable/ve_cut_icon_foreground"/>
          </adaptive-icon>
          """
          (root / "mipmap-anydpi-v26/ic_launcher.xml").write_text(adaptive)

          legacy = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FF171321" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M18,24 L35,24 L54,65 L73,24 L90,24 L62,82 Q58,90 54,90 Q50,90 46,82 Z"/>
              <path android:fillColor="#FF42E8C4"
                  android:pathData="M35,53 L76,35 L81,44 L40,62 Z"/>
              <path android:fillColor="#FF42E8C4"
                  android:pathData="M72,70 L88,70 L88,77 L72,77 Z"/>
          </vector>
          """
          (root / "mipmap-anydpi/ic_launcher.xml").write_text(legacy)

          strings = root / "values/strings.xml"
          if strings.exists():
              content = strings.read_text()
              import re
              if re.search(r'<string name="app_name">.*?</string>', content):
                  content = re.sub(r'<string name="app_name">.*?</string>',
                                   '<string name="app_name">VeCut</string>', content)
              else:
                  content = content.replace("</resources>",
                                            '    <string name="app_name">VeCut</string>\n</resources>')
              strings.write_text(content)
          else:
              strings.write_text('<resources><string name="app_name">VeCut</string></resources>')

          print("Installed VeCut adaptive and legacy launcher icons.")
          PY

      - name: Set Android compile SDK to 36
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")
          if not gradle_file.exists():
              gradle_file = Path("android/app/build.gradle.kts")
          if not gradle_file.exists():
              raise SystemExit("Could not find the generated Android app Gradle file.")

          content = gradle_file.read_text()
          replacements = (
              ("compileSdk = flutter.compileSdkVersion", "compileSdk = 36"),
              ("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36"),
              ("minSdk = flutter.minSdkVersion", "minSdk = 24"),
              ("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24"),
          )
          for old_value, new_value in replacements:
              if old_value in content:
                  content = content.replace(old_value, new_value)
          if "compileSdk = 36" not in content and "compileSdkVersion 36" not in content:
              raise SystemExit("Could not set Android compileSdk to 36.")
          if "minSdk = 24" not in content and "minSdkVersion 24" not in content:
              raise SystemExit("Could not set Android minSdk to 24.")
          gradle_file.write_text(content)
          print(f"Configured {gradle_file}: compileSdk 36, minSdk 24")

          # Flutter plugins are separate Android subprojects. Override their
          # compile SDK too, not just the main app module.
          root_gradle = Path("android/build.gradle")
          is_kotlin_dsl = False
          if not root_gradle.exists():
              root_gradle = Path("android/build.gradle.kts")
              is_kotlin_dsl = True
          if not root_gradle.exists():
              raise SystemExit("Could not find the generated root Android Gradle file (.gradle or .gradle.kts).")

          root_content = root_gradle.read_text()
          if is_kotlin_dsl:
              # Run after all projects are evaluated; registering afterEvaluate
              # on an already evaluated plugin project causes a Gradle failure.
              override = """
          // VeCut compile SDK override
          gradle.projectsEvaluated {
              rootProject.subprojects.each { project ->
                  val androidExtension = project.extensions.findByName("android")
                  val setter = androidExtension?.javaClass?.methods
                      ?.firstOrNull {
                          (it.name == "setCompileSdkVersion" || it.name == "setCompileSdk") &&
                          it.parameterCount == 1 &&
                          (it.parameterTypes[0] == Int::class.javaPrimitiveType ||
                           it.parameterTypes[0] == Int::class.javaObjectType)
                      }
                  if (androidExtension != null && setter == null) {
                      throw GradleException("Could not find an Android compile SDK setter for ${project.name}")
                  }
                  setter?.invoke(androidExtension, 36)
              }
          }
          """
          else:
              override = """
          // VeCut compile SDK override
          gradle.projectsEvaluated {
              rootProject.subprojects.each { project ->
                  def androidExtension = project.extensions.findByName('android')
                  if (androidExtension != null) {
                      def setter = androidExtension.class.methods.find {
                          (it.name == 'setCompileSdkVersion' || it.name == 'setCompileSdk') &&
                          it.parameterCount == 1 &&
                          (it.parameterTypes[0] == Integer.TYPE || it.parameterTypes[0] == Integer)
                      }
                      if (setter == null) {
                          throw new GradleException("Could not find an Android compile SDK setter for ${project.name}")
                      }
                      setter.invoke(androidExtension, 36)
                  }
              }
          }
          """
          marker = "// VeCut compile SDK override"

          if marker not in root_content:
              root_gradle.write_text(root_content.rstrip() + "\n\n" + override)
          print(f"Configured Android subprojects to compile against SDK 36 using {root_gradle}.")
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vecut-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
