name: Clean up old workflow runs

on:
  schedule:
    - cron: "17 3 * * 0" # Weekly on Sunday at 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without deleting anything"
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove old workflow runs
    runs-on: ubuntu-24.04
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 6
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
