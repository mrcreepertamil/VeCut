name: Clean up old failed workflow runs

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without deleting anything"
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove failed workflow runs older than one day
    runs-on: ubuntu-24.04
    steps:
      - name: Delete failed workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: failure
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
