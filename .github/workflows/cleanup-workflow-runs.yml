name: Clean up old workflow runs

on:
  schedule:
    - cron: "*/5 * * * *" # Check every 5 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without deleting anything"
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove expired failed and cancelled runs
    runs-on: ubuntu-24.04
    steps:
      - name: Delete expired failed and cancelled workflow runs
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === "true";
            const now = Date.now();
            const failedCutoff = now - 2 * 24 * 60 * 60 * 1000;
            const cancelledCutoff = now - 2 * 60 * 1000;

            // Read every page so cleanup applies repository-wide.
            const runs = [];
            for (let page = 1; ; page++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page
              });

              const pageRuns = Array.isArray(response.data.workflow_runs)
                ? response.data.workflow_runs
                : [];

              runs.push(...pageRuns);
              if (pageRuns.length < 100) break;
            }

            // Failed runs expire after 48 hours; cancelled runs after 2 minutes.
            // All other conclusions and in-progress runs are preserved.
            const eligibleRuns = runs.filter(run => {
              if (!run || run.status !== "completed" || !run.updated_at) return false;

              const updatedAt = Date.parse(run.updated_at);
              if (!Number.isFinite(updatedAt)) return false;

              if (run.conclusion === "failure") return updatedAt <= failedCutoff;
              if (run.conclusion === "cancelled") return updatedAt <= cancelledCutoff;
              return false;
            });

            core.info(`Found ${eligibleRuns.length} expired failed/cancelled workflow run(s).`);
            core.info(dryRun ? "DRY RUN: no runs will be deleted." : "Deletion mode enabled.");

            let deleted = 0;
            let failed = 0;

            for (const run of eligibleRuns) {
              if (dryRun) {
                core.info(`Would delete run ${run.id}: ${run.name} [${run.conclusion}] (${run.html_url})`);
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deleted++;
                core.info(`Deleted run ${run.id}: ${run.name} [${run.conclusion}]`);
              } catch (error) {
                failed++;
                core.error(`Could not delete run ${run.id}: ${error.message}`);
              }
            }

            core.info(`Cleanup summary: deleted=${deleted}, failed=${failed}, previewed=${dryRun ? eligibleRuns.length : 0}`);
            if (failed > 0) {
              core.setFailed(`Failed to delete ${failed} workflow run(s).`);
            }
