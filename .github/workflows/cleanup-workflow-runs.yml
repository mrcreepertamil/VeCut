name: Clean up all failed workflow runs

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without deleting anything"
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove all failed workflow runs
    runs-on: ubuntu-24.04
    steps:
      - name: Delete failed workflow runs
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === "true";

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 },
              response => response.data.workflow_runs
            );

            // Only completed failures are eligible. This also safely handles
            // orphaned runs because no separate unfiltered orphan cleanup exists.
            const failedRuns = runs.filter(
              run => run.status === "completed" && run.conclusion === "failure"
            );

            core.info(`Found ${failedRuns.length} completed failed workflow run(s).`);
            core.info(dryRun ? "DRY RUN: no runs will be deleted." : "Deletion mode enabled.");

            let deleted = 0;
            let failed = 0;

            for (const run of failedRuns) {
              if (dryRun) {
                core.info(`Would delete run ${run.id}: ${run.name} (${run.html_url})`);
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deleted++;
                core.info(`Deleted run ${run.id}: ${run.name}`);
              } catch (error) {
                failed++;
                core.error(`Could not delete run ${run.id}: ${error.message}`);
              }
            }

            core.info(`Cleanup summary: deleted=${deleted}, failed=${failed}, previewed=${dryRun ? failedRuns.length : 0}`);
            if (failed > 0) {
              core.setFailed(`Failed to delete ${failed} workflow run(s).`);
            }
