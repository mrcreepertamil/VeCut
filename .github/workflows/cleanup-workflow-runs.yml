name: Clean up failed workflow runs after 2 days

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without deleting anything"
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove old failed workflow runs
    runs-on: ubuntu-24.04
    steps:
      - name: Delete failed workflow runs older than 2 days
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === "true";
            const cutoff = Date.now() - 2 * 24 * 60 * 60 * 1000;

            // Read every page so cleanup applies repository-wide.
            const runs = [];
            for (let page = 1; ; page++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page
              });

              const pageRuns = Array.isArray(response.data.workflow_runs)
                ? response.data.workflow_runs
                : [];

              runs.push(...pageRuns);
              if (pageRuns.length < 100) break;
            }

            // Keep all non-failures and failures completed less than 48 hours ago.
            const eligibleRuns = runs.filter(run =>
              run &&
              run.status === "completed" &&
              run.conclusion === "failure" &&
              run.updated_at &&
              Date.parse(run.updated_at) <= cutoff
            );

            core.info(`Found ${eligibleRuns.length} failed workflow run(s) completed at least 48 hours ago.`);
            core.info(dryRun ? "DRY RUN: no runs will be deleted." : "Deletion mode enabled.");

            let deleted = 0;
            let failed = 0;

            for (const run of eligibleRuns) {
              if (dryRun) {
                core.info(`Would delete run ${run.id}: ${run.name} (${run.html_url})`);
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deleted++;
                core.info(`Deleted run ${run.id}: ${run.name}`);
              } catch (error) {
                failed++;
                core.error(`Could not delete run ${run.id}: ${error.message}`);
              }
            }

            core.info(`Cleanup summary: deleted=${deleted}, failed=${failed}, previewed=${dryRun ? eligibleRuns.length : 0}`);
            if (failed > 0) {
              core.setFailed(`Failed to delete ${failed} workflow run(s).`);
            }
