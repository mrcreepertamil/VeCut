name: Native Android

on:
  push:
    branches: [main, native-java-cpp-js-foundation]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Assemble debug APK
        working-directory: native-android
        run: gradle --no-daemon :app:assembleDebug
