plugins { id 'com.android.application' }

android {
    namespace 'com.ve.cut'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ve.cut'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0-native'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
}

dependencies {
    implementation 'org.mozilla:rhino:1.7.15'
}
